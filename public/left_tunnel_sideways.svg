<svg viewBox="0 0 120 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mountain Basalt Dark Strata -->
    <linearGradient id="leftSidewaysRock" x1="0" y1="0" x2="85" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="40%" stopColor="#131D2D" />
      <stop offset="85%" stopColor="#0B111D" />
      <stop offset="100%" stopColor="#04070D" />
    </linearGradient>

    <!-- Mountain Crest Sunlight Facet -->
    <linearGradient id="leftSidewaysRidge" x1="0" y1="0" x2="70" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#475569" stopOpacity="0.8" />
      <stop offset="60%" stopColor="#334155" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#1E293B" stopOpacity="0.1" />
    </linearGradient>

    <!-- Sideways Profile Concrete Arch Collar (Angled towards +X along tracks) -->
    <linearGradient id="leftProfileCollar" x1="58" y1="26" x2="92" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#CBD5E1" />
      <stop offset="35%" stopColor="#94A3B8" />
      <stop offset="75%" stopColor="#475569" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>

    <!-- Cavern Bore Deep Void (Receding leftwards into mountain) -->
    <linearGradient id="leftDeepVoid" x1="88" y1="48" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#090E17" stopOpacity="0.9" />
      <stop offset="65%" stopColor="#020408" stopOpacity="0.98" />
      <stop offset="100%" stopColor="#000000" stopOpacity="1" />
    </linearGradient>

    <!-- Cyberpunk Portal Keystone Glow -->
    <radialGradient id="leftKeystoneGlow" cx="74" cy="30" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00F0FF" stopOpacity="0.8" />
      <stop offset="45%" stopColor="#00F0FF" stopOpacity="0.2" />
      <stop offset="100%" stopColor="#00F0FF" stopOpacity="0" />
    </radialGradient>

    <filter id="leftSidewaysShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="3" stdDeviation="3.5" floodColor="#000000" floodOpacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#leftSidewaysShadow)">
    <!-- 1. Deep Cavern Bore (Behind track/train) - Angled sideways into mountain -->
    <path 
      d="M 52,32 
         C 68,30 84,34 89,42 
         C 92,47 91,56 87,62 
         L 50,62 
         C 46,55 46,38 52,32 Z" 
      fill="url(#leftDeepVoid)" 
    />

    <!-- 2. Massive Mountain Cliff Body (Flush to left screen edge x=0) -->
    <!-- Rises high on the left and slopes naturally over the track to the right -->
    <path 
      d="M 0,0 
         L 46,2 
         C 58,4 68,8 76,15 
         C 84,21 91,28 95,35 
         C 97,39 96,44 94,48 
         C 92,53 87,58 84,62 
         L 78,62 
         C 70,55 64,48 64,42 
         C 64,36 56,31 46,30 
         L 0,30 Z" 
      fill="url(#leftSidewaysRock)" 
    />

    <!-- 3. Geological Rock Strata & Chiseled Facets -->
    <path 
      d="M 0,0 L 38,10 L 18,28 L 0,28 Z" 
      fill="url(#leftSidewaysRidge)" 
    />
    <path 
      d="M 38,10 L 72,9 L 55,22 L 38,10 Z" 
      fill="#1E293B" 
      opacity="0.9" 
    />
    <path 
      d="M 55,22 L 76,15 L 68,32 L 55,22 Z" 
      fill="#0F172A" 
    />
    <path 
      d="M 18,28 L 48,22 L 38,40 L 0,40 L 0,28 Z" 
      fill="#141E2C" 
      opacity="0.85" 
    />

    <!-- 4. Sideways-Profile Concrete Portal Overhang Rim (Facing East along tracks) -->
    <!-- Profile Arch Lip that frames the sideways entrance -->
    <path 
      d="M 54,30 
         C 68,28 84,33 90,40 
         C 93,44 93,51 89,58 
         L 83,56 
         C 87,51 87,46 84,42 
         C 79,37 66,33 54,34 Z" 
      fill="url(#leftProfileCollar)" 
    />

    <!-- 5. Cyberpunk Portal Keystone & Luminescent Beacon -->
    <circle cx="74" cy="30" r="8" fill="url(#leftKeystoneGlow)" />
    <path 
      d="M 70,29 L 78,29 L 76,33 L 72,33 Z" 
      fill="#00F0FF" 
    />
    <circle cx="74" cy="31" r="1.4" fill="#FFFFFF" />

    <!-- 6. Foreground Rock Footing (Anchors cleanly at ground base) -->
    <path 
      d="M 0,46 L 36,46 C 44,46 50,51 52,58 L 54,64 L 0,64 Z" 
      fill="#080C14" 
    />
  </g>
</svg>
